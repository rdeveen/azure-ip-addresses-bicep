name: Update Azure Service Tags Bicep files

on:
  schedule:
    # Run every Monday at 06:00 UTC (files are typically published on Mondays)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  update-bicep:
    runs-on: ubuntu-latest
    env:
      DATE_PATTERN: '^[+-]// Generated at : [0-9]{4}-[0-9]{2}-[0-9]{2}$'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # -----------------------------------------------------------------------
      # Public Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_Public JSON
        id: download_public
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=56519" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_Public"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_Public.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_Public to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_Public.json \
            azure-public

      # -----------------------------------------------------------------------
      # China Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_China JSON
        id: download_china
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57062" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_China"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_China.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_China to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_China.json \
            azure-china

      # -----------------------------------------------------------------------
      # Azure Government Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_AzureGovernment JSON
        id: download_gov
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57063" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_AzureGovernment"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_AzureGovernment.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_AzureGovernment to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_AzureGovernment.json \
            azure-government

      # -----------------------------------------------------------------------
      # Azure Germany Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_AzureGermany JSON
        id: download_germany
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57064" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_AzureGermany"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_AzureGermany.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_AzureGermany to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_AzureGermany.json \
            azure-germany

      # -----------------------------------------------------------------------
      # Generate README files for all modules
      # -----------------------------------------------------------------------
      - name: Generate README.md files for all modules
        run: |
          python scripts/generate-readme.py

      # -----------------------------------------------------------------------
      # Detect meaningful Bicep changes and commit/push them
      # -----------------------------------------------------------------------
      - name: Detect meaningful Bicep changes
        id: detect_changes
        run: |
          git add azure-public/ azure-china/ azure-government/ azure-germany/

          has_changes=false
          if ! bicep_files_output=$(git diff --cached --name-only -- '*.bicep' 2>&1); then
            echo "::error::Unable to inspect staged Bicep files: $bicep_files_output" >&2
            exit 1
          fi
          readarray -t bicep_files <<< "$bicep_files_output"
          if [ ${#bicep_files[@]} -eq 0 ]; then
            echo "No Bicep files changed."
          else
            for file in "${bicep_files[@]}"; do
              [ -n "$file" ] || continue

              if ! numstat_output=$(git diff --cached --numstat -- "$file" 2>&1); then
                echo "::error::Unable to inspect numstat for $file: $numstat_output" >&2
                exit 1
              fi
              if ! IFS=$'\t' read -r added removed unused_path <<< "$numstat_output"; then
                echo "::error::Unexpected numstat output for $file: $numstat_output" >&2
                exit 1
              fi
              case "$added" in ''|*[!0-9]*)
                echo "::error::Unexpected numstat added count for $file: $added" >&2
                exit 1
                ;;
              esac
              case "$removed" in ''|*[!0-9]*)
                echo "::error::Unexpected numstat removed count for $file: $removed" >&2
                exit 1
                ;;
              esac

              diff_content=$(git diff --cached --unified=0 -- "$file")
              date_line_changes=$(printf '%s\n' "$diff_content" | grep -Ec "$DATE_PATTERN" || true)

              # Date-only churn is exactly one removed line and one added line.
              if [ "${added:-0}" -eq 1 ] && [ "${removed:-0}" -eq 1 ] \
                && [ "${date_line_changes:-0}" -eq 2 ]; then
                git restore --staged --worktree -- "$file"
              else
                has_changes=true
              fi
            done
          fi

          if [ "$has_changes" = true ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Meaningful Bicep changes detected."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No meaningful Bicep changes detected."
          fi

      - name: Commit and push updated Bicep files
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Azure Service Tags Bicep files ($(date -u +%F)) [skip ci]"
          git push

      # -----------------------------------------------------------------------
      # Publish Bicep modules to GHCR
      # -----------------------------------------------------------------------
      - name: Install Bicep nightly CLI
        if: steps.detect_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash <(curl -Ls https://aka.ms/bicep/nightly-cli.sh) --run-id 29027717723
          echo "$HOME/.azure/bin" >> "$GITHUB_PATH"

      - name: Log in to GitHub Container Registry
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Publish Bicep modules to GHCR  
        if: steps.detect_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKER_REGISTRY: ghcr.io
        run: |
          VERSION=$(date -u +%Y%m%d)
          REGISTRY="ghcr.io/${{ github.repository }}"

          # Convert a PascalCase/mixed service-tag name to kebab-case
          to_module_name() {
            python3 -c "
            import re, sys
            name = sys.argv[1]
            clean = re.sub(r'[^A-Za-z0-9]', '-', name)
            clean = re.sub(r'([a-z0-9])([A-Z])', r'\1-\2', clean)
            clean = re.sub(r'([A-Z]+)([A-Z][a-z])', r'\1-\2', clean)
            clean = clean.lower()
            clean = re.sub(r'-+', '-', clean).strip('-')
            print(clean)
            " "$1"
          }

          for cloud_dir in azure-public azure-china azure-government azure-germany; do
            [ -d "$cloud_dir" ] || continue
            while IFS= read -r bicep_file; do
              [ -f "$bicep_file" ] || continue
              filename=$(basename "$bicep_file" .bicep)
              module_name=$(to_module_name "$filename")
              # Determine path relative to cloud_dir (empty for root-level files)
              rel_dir=$(dirname "$bicep_file" | sed "s|^${cloud_dir}||" | sed "s|^/||")
              if [ -n "$rel_dir" ]; then
                module_path="${cloud_dir}/${rel_dir}/${module_name}"
              else
                module_path="${cloud_dir}/${module_name}"
              fi
              echo "Publishing ${module_path} to ${REGISTRY}"

              bicep publish "$bicep_file" \
                --target "br:${REGISTRY}/${module_path}:${VERSION}" \
                --force
              bicep publish "$bicep_file" \
                --target "br:${REGISTRY}/${module_path}:latest" \
                --force
            done < <(find "$cloud_dir" -name "*.bicep" -type f | sort)
          done
