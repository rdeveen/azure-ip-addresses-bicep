name: Update Azure Service Tags Bicep files

on:
  schedule:
    # Run every Monday at 06:00 UTC (files are typically published on Mondays)
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  update-bicep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # -----------------------------------------------------------------------
      # Public Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_Public JSON
        id: download_public
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=56519" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_Public"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_Public.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_Public to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_Public.json \
            azure-public

      # -----------------------------------------------------------------------
      # China Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_China JSON
        id: download_china
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57062" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_China"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_China.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_China to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_China.json \
            azure-china

      # -----------------------------------------------------------------------
      # Azure Government Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_AzureGovernment JSON
        id: download_gov
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57063" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_AzureGovernment"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_AzureGovernment.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_AzureGovernment to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_AzureGovernment.json \
            azure-government

      # -----------------------------------------------------------------------
      # Azure Germany Cloud
      # -----------------------------------------------------------------------
      - name: Download ServiceTags_AzureGermany JSON
        id: download_germany
        run: |
          DOWNLOAD_URL=$(curl -sL "https://www.microsoft.com/en-us/download/details.aspx?id=57064" \
            | grep -oP 'https://download\.microsoft\.com/download/[^"]+\.json' \
            | head -1)
          if [ -z "$DOWNLOAD_URL" ]; then
            echo "::error::Could not find download URL for ServiceTags_AzureGermany"
            exit 1
          fi
          echo "url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          curl -sL "$DOWNLOAD_URL" -o /tmp/ServiceTags_AzureGermany.json
          echo "Downloaded: $DOWNLOAD_URL"

      - name: Convert ServiceTags_AzureGermany to Bicep
        run: |
          python scripts/convert-to-bicep.py \
            /tmp/ServiceTags_AzureGermany.json \
            azure-germany

      # -----------------------------------------------------------------------
      # Generate README files for all modules
      # -----------------------------------------------------------------------
      - name: Generate README.md files for all modules
        run: |
          python scripts/generate-readme.py

      # -----------------------------------------------------------------------
      # Commit & push if anything changed
      # -----------------------------------------------------------------------
      - name: Commit and push updated Bicep files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add azure-public/ azure-china/ azure-government/ azure-germany/
          git diff --cached --name-only -- '*.bicep' | while IFS= read -r file; do
            [ -n "$file" ] || continue
            IFS=$'\t' read -r added removed unused_path <<< "$(git diff --cached --numstat -- "$file")"
            diff_content=$(git diff --cached --unified=0 -- "$file")
            date_line_changes=$(printf '%s\n' "$diff_content" | grep -Ec '^[+-]// Generated at : [0-9]{4}-[0-9]{2}-[0-9]{2}$' || true)
            # Date-only churn is exactly one removed line and one added line.
            if [ "${added:-0}" -eq 1 ] && [ "${removed:-0}" -eq 1 ] \
              && [ "${date_line_changes:-0}" -eq 2 ]; then
              # Restore both index and worktree so date-only churn is fully discarded.
              git restore --staged --worktree -- "$file"
            fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit – Bicep files are already up to date."
          else
            git commit -m "Update Azure Service Tags Bicep files ($(date -u +%F)) [skip ci]"
            git push
          fi

  publish-bicep:
    needs: update-bicep
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cloud_dir:
          - azure-public
          - azure-china
          - azure-government
          - azure-germany

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Azure CLI and Bicep
        run: |
          if ! command -v az >/dev/null 2>&1; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi
          az version
          az bicep install

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Publish Bicep modules to GHCR
        env:
          DOCKER_REGISTRY: ghcr.io
          CLOUD_DIR: ${{ matrix.cloud_dir }}
        run: |
          set -euo pipefail
          VERSION=$(date -u +%Y%m%d)
          REGISTRY="ghcr.io/${{ github.repository }}"

          if [ ! -d "$CLOUD_DIR" ]; then
            echo "Cloud directory '$CLOUD_DIR' not found; skipping."
            exit 0
          fi

          python3 - "$CLOUD_DIR" > /tmp/publish-list.txt <<'PY'
          import os, re, sys

          cloud_dir = sys.argv[1].rstrip('/')

          def to_module_name(name):
              clean = re.sub(r'[^A-Za-z0-9]', '-', name)
              clean = re.sub(r'([a-z0-9])([A-Z])', r'\1-\2', clean)
              clean = re.sub(r'([A-Z]+)([A-Z][a-z])', r'\1-\2', clean)
              clean = clean.lower()
              return re.sub(r'-+', '-', clean).strip('-')

          entries = []
          for root, _dirs, files in os.walk(cloud_dir):
              for f in files:
                  if not f.endswith('.bicep'):
                      continue
                  bicep_file = os.path.join(root, f)
                  module_name = to_module_name(f[:-len('.bicep')])
                  rel_dir = os.path.relpath(root, cloud_dir)
                  if rel_dir == '.':
                      module_path = f"{cloud_dir}/{module_name}"
                  else:
                      module_path = f"{cloud_dir}/{rel_dir}/{module_name}"
                  entries.append((bicep_file, module_path))

          for bicep_file, module_path in sorted(entries):
              print(bicep_file)
              print(module_path)
          PY

          if [ ! -s /tmp/publish-list.txt ]; then
            echo "No Bicep module files found for ${CLOUD_DIR}; skipping."
            exit 0
          fi

          publish_module() {
            local bicep_file=$1
            local module_path=$2
            local tag attempt
            echo "Publishing ${module_path} to ${REGISTRY}"
            for tag in "$VERSION" latest; do
              attempt=1
              until az bicep publish \
                --file "$bicep_file" \
                --target "br:${REGISTRY}/${module_path}:${tag}" \
                --force; do
                if [ "$attempt" -ge 3 ]; then
                  echo "::error::Failed to publish ${module_path}:${tag} after ${attempt} attempts"
                  return 1
                fi
                attempt=$((attempt + 1))
                sleep $((attempt * 5))
              done
            done
          }
          export -f publish_module
          export REGISTRY VERSION

          xargs -d '\n' -n 2 -P 16 \
            bash -c 'publish_module "$0" "$1"' \
            < /tmp/publish-list.txt
